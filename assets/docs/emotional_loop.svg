<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="loopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>

    <!-- Step Card Gradients -->
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4ED"/><stop offset="100%" stop-color="#FFE3D3"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F8F0"/><stop offset="100%" stop-color="#DEF0DC"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FD"/><stop offset="100%" stop-color="#DCE8F7"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF4F5"/><stop offset="100%" stop-color="#FCE0E4"/>
    </linearGradient>
    <linearGradient id="card5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9ED"/><stop offset="100%" stop-color="#FCEECA"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#402D1E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="260" rx="16" fill="url(#loopBg)" stroke="#E8DDCF" stroke-width="1.5"/>

  <!-- Section Title -->
  <g transform="translate(30, 24)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="16.5" font-weight="700" fill="#2E241E">
      The Emotional Loop
    </text>
    <text x="180" y="-1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#8C7968">
      — How MIMORY preserves connection without judgment or pressure
    </text>
  </g>

  <!-- 5 Circular/Looping Stages -->
  <g transform="translate(24, 56)">

    <!-- STAGE 1: Memory Created -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="168" height="175" rx="12" fill="url(#card1)" stroke="#F5CBB2" stroke-width="1.2"/>
      <rect width="36" height="36" x="14" y="14" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="32" y="38" font-size="18" text-anchor="middle">📸</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#BA4716" letter-spacing="0.5">01. CAPTURE</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3D291C">Memory Created</text>
      <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#694D3B">
        <tspan x="14" dy="0">A photo, note, or trip</tspan>
        <tspan x="14" dy="15">milestone is saved into</tspan>
        <tspan x="14" dy="15">your shared world.</tspan>
      </text>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(172, 80)">
      <path d="M 0,10 L 10,10 M 6,6 L 10,10 L 6,14" stroke="#C4B099" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- STAGE 2: World Blooms -->
    <g transform="translate(186, 0)" filter="url(#cardShadow)">
      <rect width="168" height="175" rx="12" fill="url(#card2)" stroke="#BDDCB6" stroke-width="1.2"/>
      <rect width="36" height="36" x="14" y="14" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="32" y="38" font-size="18" text-anchor="middle">🌿</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#2E6624" letter-spacing="0.5">02. EXPANSION</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3D291C">The World Blooms</text>
      <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#4B6145">
        <tspan x="14" dy="0">A spatial landmark</tspan>
        <tspan x="14" dy="15">appears; the island</tspan>
        <tspan x="14" dy="15">deepens with flora.</tspan>
      </text>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(358, 80)">
      <path d="M 0,10 L 10,10 M 6,6 L 10,10 L 6,14" stroke="#C4B099" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- STAGE 3: Quiet Period -->
    <g transform="translate(372, 0)" filter="url(#cardShadow)">
      <rect width="168" height="175" rx="12" fill="url(#card3)" stroke="#BDD6F2" stroke-width="1.2"/>
      <rect width="36" height="36" x="14" y="14" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="32" y="38" font-size="18" text-anchor="middle">🌙</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#2963A0" letter-spacing="0.5">03. LIFE HAPPENS</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3D291C">A Quiet Period</text>
      <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#475C73">
        <tspan x="14" dy="0">Life gets busy, quiet,</tspan>
        <tspan x="14" dy="15">or a temporary dispute</tspan>
        <tspan x="14" dy="15">blurs the bigger story.</tspan>
      </text>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(544, 80)">
      <path d="M 0,10 L 10,10 M 6,6 L 10,10 L 6,14" stroke="#C4B099" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- STAGE 4: Gentle Resurface -->
    <g transform="translate(558, 0)" filter="url(#cardShadow)">
      <rect width="168" height="175" rx="12" fill="url(#card4)" stroke="#F5C0C8" stroke-width="1.4"/>
      <rect width="36" height="36" x="14" y="14" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="32" y="38" font-size="18" text-anchor="middle">💌</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#B33E50" letter-spacing="0.5">04. GENTLE NUDGE</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3D291C">Memory Resurfaces</text>
      <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="400" fill="#693F46">
        <tspan x="14" dy="0">"Your world has been</tspan>
        <tspan x="14" dy="14">a little quiet. Here's a</tspan>
        <tspan x="14" dy="14">moment worth remembering. ♡"</tspan>
      </text>
    </g>

    <!-- Connector 4 -->
    <g transform="translate(730, 80)">
      <path d="M 0,10 L 10,10 M 6,6 L 10,10 L 6,14" stroke="#C4B099" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- STAGE 5: Story Restored -->
    <g transform="translate(744, 0)" filter="url(#cardShadow)">
      <rect width="168" height="175" rx="12" fill="url(#card5)" stroke="#F2D18F" stroke-width="1.2"/>
      <rect width="36" height="36" x="14" y="14" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="32" y="38" font-size="18" text-anchor="middle">💖</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#996817" letter-spacing="0.5">05. PERSPECTIVE</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3D291C">The Story Returns</text>
      <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#695133">
        <tspan x="14" dy="0">You remember what</tspan>
        <tspan x="14" dy="15">you built together.</tspan>
        <tspan x="14" dy="15">Perspective restored.</tspan>
      </text>
    </g>
  </g>
</svg>
