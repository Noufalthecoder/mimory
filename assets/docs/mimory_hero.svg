<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#FFF6EE"/>
      <stop offset="100%" stop-color="#F2F8F1"/>
    </linearGradient>

    <!-- Island Gradients -->
    <linearGradient id="meadowTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A2DB95"/>
      <stop offset="50%" stop-color="#82C476"/>
      <stop offset="100%" stop-color="#6CAE5F"/>
    </linearGradient>
    <linearGradient id="earthCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1BC9D"/>
      <stop offset="100%" stop-color="#9C8262"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6F0"/>
    </linearGradient>

    <!-- Drop Shadows (Universal SVG Filters) -->
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4A3423" flood-opacity="0.10"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3A281A" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="1040" height="430" rx="24" fill="url(#heroBg)" stroke="#EBDDCF" stroke-width="1.5"/>

  <!-- Ambient Storybook Stars -->
  <g opacity="0.65">
    <circle cx="110" cy="65" r="2.5" fill="#E88B97"/>
    <circle cx="480" cy="45" r="2" fill="#E5A04D"/>
    <circle cx="530" cy="225" r="2.5" fill="#7CAE74"/>
    <circle cx="85" cy="355" r="2" fill="#D4A755"/>
    <path d="M440,110 L443,116 L449,119 L443,122 L440,128 L437,122 L431,119 L437,116 Z" fill="#F4BA68" opacity="0.7"/>
    <path d="M970,70 L973,76 L979,79 L973,82 L970,88 L967,82 L961,79 L967,76 Z" fill="#E88B97" opacity="0.6"/>
  </g>

  <!-- ================= LEFT COLUMN: PRODUCT STORY & TYPOGRAPHY ================= -->
  <!-- Strict boundary: x = 54 to x = 510 -->
  <g transform="translate(54, 50)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#FCEAEB" stroke="#F4C7CD" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="4.5" fill="#D95D70"/>
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A83244" letter-spacing="0.5">LIVING MEMORY EXPERIENCE</text>
    </g>

    <!-- Brand Wordmark -->
    <text x="0" y="82" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="800" fill="#2D241E" letter-spacing="-0.5">
      MIMORY <tspan fill="#E85D6F">♡</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#D36F46" letter-spacing="-0.2">
      Your people. Your moments. Your world.
    </text>

    <!-- Core Emotion Copy -->
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5E5045" line-height="1.6">
      <tspan x="0" dy="0">A living storybook space that turns meaningful moments shared with</tspan>
      <tspan x="0" dy="23">the people who matter into interactive 2.5D worlds you can explore,</tspan>
      <tspan x="0" dy="23">walk through, and gently revisit when life becomes quiet.</tspan>
    </text>

    <!-- Emotional Promise Card -->
    <g transform="translate(0, 242)">
      <rect width="445" height="42" rx="10" fill="#FFFFFF" stroke="#E6DDD0" stroke-width="1.2"/>
      <text x="16" y="26" font-family="'Georgia', 'Times New Roman', serif" font-size="13.5" font-weight="600" fill="#7A4B32" font-style="italic">
        "Don't let one moment rewrite your whole story."
      </text>
    </g>

    <!-- Tech Badges Strip -->
    <g transform="translate(0, 308)">
      <g transform="translate(0, 0)">
        <rect width="94" height="28" rx="8" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#02569B"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#2E3842">Flutter 3.x</text>
      </g>
      <g transform="translate(102, 0)">
        <rect width="74" height="28" rx="8" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#0175C2"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#2E3842">Dart</text>
      </g>
      <g transform="translate(184, 0)">
        <rect width="122" height="28" rx="8" fill="#FEF6EE" stroke="#F6D4B0" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#E56A38"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#A84318">RevenueCat</text>
      </g>
      <g transform="translate(314, 0)">
        <rect width="106" height="28" rx="8" fill="#F2F8F0" stroke="#CCE0C8" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#5F9E52"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#2E6123">Local-First</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 3D LIVING WORLD DIORAMA ================= -->
  <!-- Strict boundary: x = 570 to x = 990 -->
  <g transform="translate(570, 42)">

    <!-- Island Ground Shadow -->
    <ellipse cx="200" cy="308" rx="175" ry="44" fill="#3D2919" opacity="0.10" filter="url(#heroShadow)"/>

    <!-- Island Underground Crust -->
    <g filter="url(#heroShadow)">
      <path d="M 40,212 Q 200,268 360,212 L 338,272 Q 200,324 62,272 Z" fill="url(#earthCrust)" stroke="#8C7456" stroke-width="1.5"/>
      <!-- Top Grassy Meadow Surface -->
      <path d="M 30,196 Q 200,134 370,196 Q 200,258 30,196 Z" fill="url(#meadowTop)" stroke="#5B9350" stroke-width="2"/>
    </g>

    <!-- Cobblestone Walking Path -->
    <path d="M 70,199 Q 150,179 200,212 Q 255,244 325,206" fill="none" stroke="#EFE4D2" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    <path d="M 70,199 Q 150,179 200,212 Q 255,244 325,206" fill="none" stroke="#DBC8AD" stroke-width="13" stroke-linecap="round" opacity="0.7"/>

    <!-- Storybook Cottage -->
    <g transform="translate(68, 118)">
      <rect width="56" height="46" x="0" y="26" rx="4" fill="#FAF5EB" stroke="#685648" stroke-width="2"/>
      <polygon points="28,0 -10,28 66,28" fill="#D9665B" stroke="#685648" stroke-width="2"/>
      <rect width="14" height="14" x="8" y="36" rx="2" fill="#FEE398" stroke="#685648" stroke-width="1.5"/>
      <line x1="15" y1="36" x2="15" y2="50" stroke="#685648" stroke-width="1"/>
      <line x1="8" y1="43" x2="22" y2="43" stroke="#685648" stroke-width="1"/>
      <rect width="14" height="24" x="34" y="48" rx="2" fill="#8C6347" stroke="#685648" stroke-width="1.5"/>
      <rect width="8" height="14" x="42" y="6" fill="#A8907E" stroke="#685648" stroke-width="1.5"/>
      <circle cx="46" cy="0" r="4" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="50" cy="-8" r="6" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Cherry Blossom Tree -->
    <g transform="translate(295, 92)">
      <path d="M 20,108 Q 22,68 16,42 Q 24,58 30,108 Z" fill="#6E4D36" stroke="#483222" stroke-width="1.5"/>
      <circle cx="16" cy="34" r="30" fill="#F8A5B2" stroke="#483222" stroke-width="2"/>
      <circle cx="38" cy="24" r="26" fill="#FBBEC7" stroke="#483222" stroke-width="2"/>
      <circle cx="4" cy="20" r="22" fill="#FAD1D8" stroke="#483222" stroke-width="1.5"/>
    </g>

    <!-- Couple Chibi Avatars Holding Hands -->
    <g transform="translate(180, 160)">
      <!-- Boy -->
      <g transform="translate(0, 0)">
        <ellipse cx="10" cy="38" r="8" ry="3" fill="#2E4A28" opacity="0.3"/>
        <rect width="14" height="20" x="3" y="17" rx="5" fill="#789DC9" stroke="#333" stroke-width="1.5"/>
        <circle cx="10" cy="11" r="9.5" fill="#FFDFC4" stroke="#333" stroke-width="1.5"/>
        <path d="M 2,9 Q 10,0 18,7 Q 16,3 10,3 Q 4,3 2,9 Z" fill="#4E3629" stroke="#333" stroke-width="1.2"/>
        <circle cx="7" cy="11" r="1" fill="#333"/>
        <circle cx="13" cy="11" r="1" fill="#333"/>
      </g>

      <!-- Floating Heart -->
      <path d="M 20,8 C 20,5 17,5 17,8 C 17,11 20,13 20,15 C 20,13 23,11 23,8 C 23,5 20,5 20,8 Z" fill="#E85D6F"/>

      <!-- Girl -->
      <g transform="translate(20, 2)">
        <ellipse cx="10" cy="36" r="8" ry="3" fill="#2E4A28" opacity="0.3"/>
        <path d="M 4,17 L 16,17 L 18,34 L 2,34 Z" fill="#F293A2" stroke="#333" stroke-width="1.5"/>
        <circle cx="10" cy="11" r="9" fill="#FFF0E1" stroke="#333" stroke-width="1.5"/>
        <path d="M 2,8 Q 10,1 18,8" fill="#6A4938" stroke="#333" stroke-width="1.2"/>
        <circle cx="10" cy="10" r="3.5" fill="#6A4938" stroke="#333" stroke-width="1"/>
        <circle cx="7" cy="11" r="1" fill="#333"/>
        <circle cx="13" cy="11" r="1" fill="#333"/>
      </g>
    </g>

    <!-- Garden Rabbit -->
    <g transform="translate(142, 206)">
      <ellipse cx="8" cy="10" r="6" ry="5" fill="#FFFFFF" stroke="#483222" stroke-width="1.2"/>
      <ellipse cx="6" cy="4" r="2" ry="5" fill="#FFD8DF" stroke="#483222" stroke-width="1" transform="rotate(-10 6 4)"/>
      <ellipse cx="10" cy="4" r="2" ry="5" fill="#FFD8DF" stroke="#483222" stroke-width="1" transform="rotate(10 10 4)"/>
      <circle cx="7" cy="9" r="0.8" fill="#483222"/>
      <circle cx="10" cy="9" r="0.8" fill="#483222"/>
    </g>

    <!-- ================= FLOATING STORYBOOK CARDS ================= -->
    <!-- Card 1: Spatial Landmark (Top Left of Island) -->
    <g transform="translate(5, 25)" filter="url(#cardShadow)">
      <rect width="154" height="48" rx="10" fill="url(#cardBg)" stroke="#EBDDC8" stroke-width="1.5"/>
      <rect width="30" height="30" x="9" y="9" rx="7" fill="#FFEFEA"/>
      <text x="24" y="29" font-size="15" text-anchor="middle">📍</text>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2E241E">Sunset Beach</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" fill="#8C7969">Spatial Landmark</text>
    </g>

    <!-- Card 2: Hand Holding (Bottom Right of Island) -->
    <g transform="translate(245, 236)" filter="url(#cardShadow)">
      <rect width="146" height="46" rx="10" fill="url(#cardBg)" stroke="#EBDDC8" stroke-width="1.5"/>
      <rect width="28" height="28" x="9" y="9" rx="7" fill="#FCEAEB"/>
      <text x="23" y="28" font-size="14" text-anchor="middle">❤️</text>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#B83A4B">Holding Hands</text>
      <text x="44" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#5F9E52">Paired Walk Engine</text>
    </g>

    <!-- Card 3: mimory_plus Verified (Top Right of Island) -->
    <g transform="translate(248, 15)" filter="url(#cardShadow)">
      <rect width="144" height="44" rx="10" fill="#FEF8ED" stroke="#F6D49F" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="10" fill="#F4BA44"/>
      <text x="22" y="26" font-size="11" text-anchor="middle" fill="#FFFFFF">✨</text>
      <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#995D13">mimory_plus</text>
      <text x="38" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#4B8A3E">REVENUECAT VERIFIED</text>
    </g>
  </g>
</svg>
