<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>

    <!-- Step Gradients -->
    <linearGradient id="step1Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3EB"/><stop offset="100%" stop-color="#FFE3D1"/>
    </linearGradient>
    <linearGradient id="step2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EA"/><stop offset="100%" stop-color="#FDF0CC"/>
    </linearGradient>
    <linearGradient id="step3Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F7EE"/><stop offset="100%" stop-color="#DEEED9"/>
    </linearGradient>
    <linearGradient id="step4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF0F2"/><stop offset="100%" stop-color="#F9D7DC"/>
    </linearGradient>
    <linearGradient id="step5Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F5FC"/><stop offset="100%" stop-color="#D9E7F7"/>
    </linearGradient>
    <linearGradient id="step6Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E8"/><stop offset="100%" stop-color="#F5E3BD"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#402D1E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="960" height="210" rx="16" fill="url(#flowBg)" stroke="#E8DDCF" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(30, 24)">
    <text font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#2E241E">
      From a Moment to a Living World
    </text>
    <text x="255" y="-1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#8C7968">
      — The six continuous stages of the MIMORY product mental model
    </text>
  </g>

  <!-- 6 PIPELINE CARDS -->
  <g transform="translate(24, 52)">

    <!-- CARD 1: CAMERA ROLL -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="138" height="132" rx="12" fill="url(#step1Bg)" stroke="#F5CBB2" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">📱</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#B85827" letter-spacing="0.5">01. CAMERA ROLL</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Scattered Past</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#694D3B">
        <tspan x="12" dy="0">Photos &amp; messages</tspan>
        <tspan x="12" dy="13">lost in endless</tspan>
        <tspan x="12" dy="13">digital timelines.</tspan>
      </text>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(141, 56)">
      <path d="M 0,10 L 7,10 M 4,6 L 8,10 L 4,14" stroke="#C4B099" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CARD 2: MEMORY -->
    <g transform="translate(152, 0)" filter="url(#cardShadow)">
      <rect width="138" height="132" rx="12" fill="url(#step2Bg)" stroke="#EED89E" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">✨</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#996D12" letter-spacing="0.5">02. MEMORY</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Chosen Moment</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#694D3B">
        <tspan x="12" dy="0">Selected with love</tspan>
        <tspan x="12" dy="13">to remember what</tspan>
        <tspan x="12" dy="13">truly matters.</tspan>
      </text>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(293, 56)">
      <path d="M 0,10 L 7,10 M 4,6 L 8,10 L 4,14" stroke="#C4B099" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CARD 3: KEEPSAKE -->
    <g transform="translate(304, 0)" filter="url(#cardShadow)">
      <rect width="138" height="132" rx="12" fill="url(#step3Bg)" stroke="#BBD8B4" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">📸</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#3E7D33" letter-spacing="0.5">03. KEEPSAKE</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Story Vignette</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#4B6145">
        <tspan x="12" dy="0">Preserved with photo,</tspan>
        <tspan x="12" dy="13">milestone story, and</tspan>
        <tspan x="12" dy="13">exact calendar date.</tspan>
      </text>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(445, 56)">
      <path d="M 0,10 L 7,10 M 4,6 L 8,10 L 4,14" stroke="#C4B099" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CARD 4: LANDMARK -->
    <g transform="translate(456, 0)" filter="url(#cardShadow)">
      <rect width="138" height="132" rx="12" fill="url(#step4Bg)" stroke="#ECC2CA" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">📍</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#B34254" letter-spacing="0.5">04. LANDMARK</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Spatial Anchor</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#694149">
        <tspan x="12" dy="0">Planted as a physical</tspan>
        <tspan x="12" dy="13">landmark along your</tspan>
        <tspan x="12" dy="13">scenic world paths.</tspan>
      </text>
    </g>

    <!-- Connector 4 -->
    <g transform="translate(597, 56)">
      <path d="M 0,10 L 7,10 M 4,6 L 8,10 L 4,14" stroke="#C4B099" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CARD 5: LIVING WORLD -->
    <g transform="translate(608, 0)" filter="url(#cardShadow)">
      <rect width="138" height="132" rx="12" fill="url(#step5Bg)" stroke="#B6D1EE" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">🏡</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#2963A0" letter-spacing="0.5">05. LIVING WORLD</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Dynamic Realm</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#44576B">
        <tspan x="12" dy="0">Atmosphere, seasons,</tspan>
        <tspan x="12" dy="13">and weather bloom</tspan>
        <tspan x="12" dy="13">around your story.</tspan>
      </text>
    </g>

    <!-- Connector 5 -->
    <g transform="translate(749, 56)">
      <path d="M 0,10 L 7,10 M 4,6 L 8,10 L 4,14" stroke="#C4B099" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- CARD 6: MEMORY WALK -->
    <g transform="translate(760, 0)" filter="url(#cardShadow)">
      <rect width="144" height="132" rx="12" fill="url(#step6Bg)" stroke="#E5C78E" stroke-width="1.2"/>
      <rect width="36" height="36" x="12" y="12" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="30" y="36" font-size="18" text-anchor="middle">🚶‍♀️</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#996817" letter-spacing="0.5">06. MEMORY WALK</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3D291C">Shared Journey</text>
      <text x="12" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#695133">
        <tspan x="12" dy="0">Walk together along</tspan>
        <tspan x="12" dy="13">winding paths and</tspan>
        <tspan x="12" dy="13">hold hands in 2.5D.</tspan>
      </text>
    </g>
  </g>
</svg>
