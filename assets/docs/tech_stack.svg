<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 136" width="960" height="136">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/><stop offset="100%" stop-color="#F4EFE7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FAF5EE"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#442E1D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="136" rx="14" fill="url(#techBg)" stroke="#EBDDCF" stroke-width="1.2"/>

  <!-- 5 Technology Tiles -->
  <g transform="translate(18, 16)">

    <!-- Tile 1: Flutter -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
      <rect width="176" height="104" rx="10" fill="url(#cardGrad)" stroke="#CADBEA" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#E8F2FA"/>
      <path d="M 20,24 L 25,18 L 28,18 L 23,24 L 28,30 L 25,30 Z" fill="#02569B"/>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#02569B">Flutter 3.x</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#3D2B1F">UI &amp; Canvas Engine</text>
      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="400" fill="#6B5647">
        <tspan x="14" dy="0">Native 60fps canvas</tspan>
        <tspan x="14" dy="12">rendering for iOS &amp; Android.</tspan>
      </text>
    </g>

    <!-- Tile 2: Dart -->
    <g transform="translate(187, 0)" filter="url(#softShadow)">
      <rect width="176" height="104" rx="10" fill="url(#cardGrad)" stroke="#C6E0EE" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#E6F5FC"/>
      <path d="M 19,20 L 26,18 L 29,22 L 23,29 Z" fill="#0175C2"/>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0175C2">Dart SDK</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#3D2B1F">Reactive Language</text>
      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="400" fill="#6B5647">
        <tspan x="14" dy="0">Type-safe immutable data</tspan>
        <tspan x="14" dy="12">models &amp; ChangeNotifier state.</tspan>
      </text>
    </g>

    <!-- Tile 3: RevenueCat -->
    <g transform="translate(374, 0)" filter="url(#softShadow)">
      <rect width="186" height="104" rx="10" fill="#FEF7F0" stroke="#F4C7A2" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="10" fill="#FEE9D6"/>
      <path d="M 21,20 L 27,24 L 21,28 Z" fill="#E56A38"/>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#A84318">RevenueCat</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#8C350E">purchases_flutter</text>
      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="400" fill="#6B4B38">
        <tspan x="14" dy="0">Entitlement validation,</tspan>
        <tspan x="14" dy="12">offerings &amp; Test Store sandbox.</tspan>
      </text>
    </g>

    <!-- Tile 4: Local Storage -->
    <g transform="translate(570, 0)" filter="url(#softShadow)">
      <rect width="174" height="104" rx="10" fill="url(#cardGrad)" stroke="#CCE0CA" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#EDF7EB"/>
      <text x="24" y="28" font-size="12" text-anchor="middle">💾</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#2E6123">Preferences</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#3D2B1F">Local-First Storage</text>
      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="400" fill="#586354">
        <tspan x="14" dy="0">Fast offline JSON key-value</tspan>
        <tspan x="14" dy="12">worlds &amp; memories storage.</tspan>
      </text>
    </g>

    <!-- Tile 5: Document Sandbox -->
    <g transform="translate(754, 0)" filter="url(#softShadow)">
      <rect width="170" height="104" rx="10" fill="url(#cardGrad)" stroke="#DFD3C4" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#FAF0E3"/>
      <text x="24" y="28" font-size="12" text-anchor="middle">📁</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#754823">PathProvider</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#3D2B1F">Media Sandbox</text>
      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="400" fill="#6B5647">
        <tspan x="14" dy="0">Sandboxed app filesystem</tspan>
        <tspan x="14" dy="12">for high-res keepsake photos.</tspan>
      </text>
    </g>
  </g>
</svg>
